name: Bug
description: Behavior differs from the PRD or docs
labels: ["type:bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: Steps and actual behavior
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given / When / Then. Becomes the regression test.
    validations: { required: true }
