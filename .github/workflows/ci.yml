name: CI
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The image already holds the browsers and their system libraries. Keep its tag equal to
    # the Playwright version in package.json (a test checks this).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn

  pr-closes-issue:
    timeout-minutes: 5
    # Bots (Dependabot) do not close issues, so they are exempt.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: PR body must close an issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+'; then
            echo "Linked issue found."
          else
            echo "::error::PR body needs 'Closes #N' for the issue it ships."
            exit 1
          fi
