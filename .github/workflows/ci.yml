name: CI
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

# #481: a new push to a pull request cancels its older run, which is still checking an old commit.
# - Pull requests: one group per pull request, split in two. Code events (opened, synchronize,
#   reopened) share the "code" group; body edits (edited) have their own "body" group. So a body
#   edit never cancels a running check of the same commit, and a new push never cancels a body run.
#   Either way the newest run of each group reports every check (check, pr-closes-issue,
#   pr-human-steps), so no required check is left missing.
# - Pushes to main: the group is the run id, unique per run, so a run on main is never cancelled
#   (not even a queued one, which a shared group would replace).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.event.action == 'edited' && 'body' || 'code') || format('push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The image already holds the browsers and their system libraries. Keep its tag equal to
    # the Playwright version in package.json (a test checks this).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Seed card checks
        run: npm run check:cards
      - name: Unit tests
        run: npm test
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn

  pr-closes-issue:
    timeout-minutes: 5
    # Bots (Dependabot) do not close issues, so pull requests they opened are exempt,
    # even when a person pushes a fix to the branch.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: PR body must close an issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+'; then
            echo "Linked issue found."
          else
            echo "::error::PR body needs 'Closes #N' for the issue it ships."
            exit 1
          fi

  # #189: every pull request says what a human must do after it ("None" or numbered steps), a new
  # migration is listed as "Apply to dev, then prod", migration file names stay unique and in
  # timestamp order, and a new environment variable is named in .env.example, docs/deploy.md and
  # the Human steps. Same trigger and Dependabot exemption as pr-closes-issue.
  pr-human-steps:
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # The checkout is GitHub's merge of the pull request into its base, so HEAD^1 is the base
      # commit this run compares with.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Explain a failed checkout
        if: ${{ failure() }}
        run: echo "::error::The pull request could not be checked out as a merge with its base. If it has merge conflicts, merge origin/main into the branch, fix the conflicts and push; the check then runs again."
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: PR body must list its human steps
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE_REF: HEAD^1
        run: npm run check:pr
