<title>WaveParticle Content Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: a working tool. Left rail of pages, a dense main area; at phone width the rail becomes a scrolling strip. */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --ink:#1d2421; --muted:#5f6b66; --line:#dde2df; --soft:#eef1ef;
  --accent:#1f6f5c; --accent-soft:#e2f0eb; --ok:#2f7d4f; --ok-soft:#e3f2e8; --warn:#9a6a10; --warn-soft:#fbf0d9;
  --bad:#b23b3b; --bad-soft:#f8e3e3; --info:#3a5ea8; --info-soft:#e4ebf8; --phone:#16191c; --phone-ink:#ece7dc;
  --f-display:"Fraunces",Georgia,serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121615; --panel:#1a1f1e; --ink:#e4e9e6; --muted:#9aa6a1; --line:#2c3432; --soft:#212826;
  --accent:#5fc0a3; --accent-soft:#1d3530; --ok:#6cc58f; --ok-soft:#1c3226; --warn:#e0b55a; --warn-soft:#3a2f17;
  --bad:#ec8585; --bad-soft:#3d2121; --info:#8fb0f0; --info-soft:#1f2a40; --phone:#0b0d0e; --phone-ink:#ece7dc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --panel:#1a1f1e; --ink:#e4e9e6; --muted:#9aa6a1; --line:#2c3432; --soft:#212826;
  --accent:#5fc0a3; --accent-soft:#1d3530; --ok:#6cc58f; --ok-soft:#1c3226; --warn:#e0b55a; --warn-soft:#3a2f17;
  --bad:#ec8585; --bad-soft:#3d2121; --info:#8fb0f0; --info-soft:#1f2a40; --phone:#0b0d0e; --phone-ink:#ece7dc; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{font-family:var(--f-display);font-size:19px;font-weight:600;padding:0 8px 2px}
.brand small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.proto{margin:12px 8px 14px;font-size:11.5px;background:var(--warn-soft);color:var(--warn);padding:6px 8px;border-radius:6px}
.navgroup{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.rail a{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none}
.rail a:hover{background:var(--soft)}
.rail a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail a .k{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-weight:400}
main{padding-block:22px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb a{color:var(--muted)}
h1{font-family:var(--f-display);font-weight:600;font-size:26px;margin:4px 0 4px;text-wrap:balance}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
.lede{color:var(--muted);max-width:68ch;margin:0 0 18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:7px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
button.small{font-size:12px;padding:3px 9px}
button:focus-visible,a:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.key{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--soft);padding:1px 6px;border-radius:4px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-draft{background:var(--soft);color:var(--muted)}
.s-gen{background:var(--info-soft);color:var(--info)}
.s-fail{background:var(--bad-soft);color:var(--bad)}
.s-checked{background:var(--warn-soft);color:var(--warn)}
.s-read{background:var(--accent-soft);color:var(--accent)}
.s-pub{background:var(--ok-soft);color:var(--ok)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile b{display:block;font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
/* status board */
.board td.cell{padding:4px 3px;text-align:center}
.dot{display:inline-block;width:18px;height:18px;border-radius:4px;border:1px solid var(--line);background:var(--soft)}
.dot.d1{background:var(--info-soft);border-color:var(--info)}
.dot.d2{background:var(--warn-soft);border-color:var(--warn)}
.dot.d3{background:var(--accent-soft);border-color:var(--accent)}
.dot.d4{background:var(--ok);border-color:var(--ok)}
.dot.bad{background:var(--bad-soft);border-color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
/* pipeline */
.flow{display:grid;grid-template-columns:minmax(150px,1fr) 34px minmax(150px,1fr) 34px minmax(150px,1fr) 34px minmax(150px,1fr);align-items:stretch;min-width:820px}
.flow .col{display:flex;flex-direction:column;gap:6px}
.flow .colhead{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.node{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.node .key{margin-right:4px}
.arrow{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.lane{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);margin-bottom:14px}
.lane h2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lane p{color:var(--muted);margin:0 0 12px;max-width:80ch}
.states{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 0;font-size:12px}
/* cards editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.part{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:12px}
.part>header{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cardrow{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:start}
.cardrow:last-child{border-bottom:0}
.cardrow .kind{font-size:12px;color:var(--muted);padding-top:2px}
.cardrow .txt{border-radius:6px;padding:2px 4px;margin:-2px -4px}
.cardrow .txt[contenteditable="true"]{background:var(--soft);outline:1px dashed var(--accent)}
.cardrow .meta{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.fails{font-size:11.5px;color:var(--bad)}
.phone{background:var(--phone);color:var(--phone-ink);border-radius:26px;padding:18px 16px 22px;position:sticky;top:16px}
.phone .ph-top{font-size:11px;opacity:.6;display:flex;justify-content:space-between}
.phone .ph-goal{font-size:11px;opacity:.7;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.08em}
.phone .ph-goaltext{font-family:var(--f-display);font-size:15px;margin-bottom:14px}
.phone .slip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px;font-size:13.5px;line-height:1.55;min-height:120px}
.phone .slip small{display:block;opacity:.6;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.phone .ph-step{font-size:12px;opacity:.8;margin-top:12px}
.phone .ph-clock{font-family:var(--f-mono);font-size:28px;text-align:center;margin-top:10px}
/* prompts */
.assembly{display:flex;flex-direction:column;gap:6px}
.ppart{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--panel)}
.ppart.on{border-left-color:var(--accent);background:var(--accent-soft)}
.ppart .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.ppart .plus{color:var(--muted);text-align:center;font-size:12px}
pre.code{font-family:var(--f-mono);font-size:12px;background:var(--soft);border-radius:8px;padding:12px;white-space:pre-wrap;margin:0;line-height:1.55}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp .panel p{margin:0 0 8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 10px}
.tabs button.on{border-bottom-color:var(--accent);color:var(--accent);font-weight:600}
dl.fields{display:grid;grid-template-columns:170px minmax(0,1fr);gap:0;margin:0}
dl.fields dt,dl.fields dd{padding:9px 0;border-bottom:1px solid var(--line);margin:0}
dl.fields dt{color:var(--muted);font-size:12.5px;padding-right:12px}
dl.fields dd .key{margin-left:6px}
.note{font-size:12.5px;color:var(--muted)}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
select,input[type=text],textarea{font:inherit;font-size:13.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.check{display:flex!important;grid-template-columns:none;align-items:center;gap:8px;font-weight:400!important;color:var(--ink)!important}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.est{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13px}
dialog.sheet{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog.sheet::backdrop{background:rgba(0,0,0,.35)}
dialog.sheet .sh-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
dialog.sheet .sh-head h2{margin:0;font-size:16px}
dialog.sheet .sh-body{padding:16px;overflow:auto}
dialog.sheet .sh-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.lock{font-size:11.5px;color:var(--accent);font-weight:600}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.conn.off i{background:var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20}
.phase{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.phase:last-child{border-bottom:0}
.phase .pn{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500}
.phase h3{margin:0 0 4px;font-size:15px}
.phase p{margin:0 0 6px;color:var(--muted)}
.phase ul{margin:4px 0 0;padding-left:18px}
.idrow{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1.1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.idrow:last-child{border-bottom:0}
.idrow code{font-family:var(--f-mono);font-size:12px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;display:flex;gap:4px;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line)}
  .rail .brand,.rail .proto,.navgroup{display:none}
  .rail a{white-space:nowrap}
  .rail a .k{display:none}
  .editor{grid-template-columns:1fr}
  .phone{position:static}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3,.cmp{grid-template-columns:1fr}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  dl.fields{grid-template-columns:1fr}
  dl.fields dt{border-bottom:0;padding-bottom:0}
  .idrow{grid-template-columns:1fr}
  .cardrow{grid-template-columns:1fr}
  .cardrow .meta{align-items:flex-start;flex-direction:row;flex-wrap:wrap}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
</style>

<div class="app">
  <nav class="rail" id="rail" aria-label="Admin pages"></nav>
  <main id="main"></main>
</div>

<script>
const PAGES=[
 {g:"Overview"},
 {id:"board",k:"ADM-01",t:"Status board"},
 {id:"pipeline",k:"ADM-02",t:"Pipeline"},
 {g:"Content"},
 {id:"characters",k:"ADM-03",t:"Characters"},
 {id:"character",k:"ADM-04",t:"Character profile"},
 {id:"lifepath",k:"ADM-05",t:"Life path"},
 {id:"cards",k:"ADM-06",t:"Story cards"},
 {id:"uitext",k:"ADM-07",t:"App text"},
 {id:"hotlines",k:"ADM-14",t:"Hotlines"},
 {id:"hotline",k:"ADM-15",t:"Hotline entry"},
 {g:"AI rules"},
 {id:"prompts",k:"ADM-08",t:"Prompts"},
 {id:"checks",k:"ADM-09",t:"Checks"},
 {id:"models",k:"ADM-13",t:"Models"},
 {g:"Review and logs"},
 {id:"review",k:"ADM-10",t:"Review queue"},
 {id:"live",k:"ADM-11",t:"Live log"},
 {id:"history",k:"ADM-12",t:"Publish history"},
 {g:"Reference"},
 {id:"ids",k:"REF",t:"Naming scheme"},
 {id:"plan",k:"REF",t:"Build plan"}
];
const STATE={draft:["s-draft","Draft"],gen:["s-gen","Generated"],fail:["s-fail","Check failed"],checked:["s-checked","Checks passed"],read:["s-read","Read by a person"],pub:["s-pub","Published"]};
const pill=s=>`<span class="pill ${STATE[s][0]}">${STATE[s][1]}</span>`;
const key=k=>`<span class="key">${k}</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const STORIES=[["bohr-difficulties","The Trade of a Theorist","The Cambridge years"],["tolman-lecture","The First Course at Berkeley","The Berkeley years"],["truchas-morning","The Morning at Lake Katherine","The Berkeley years"],["midnight-pamphlet","The Midnight Pamphlet","The Berkeley years"],["marry-a-friend","A Friend of Yours","The Berkeley years"],["union-meeting","The Union Meeting at Eagle Hill","The Berkeley years"],["groves-berkeley","The General Comes to Berkeley","The Berkeley years"],["site-search","The Canyon and the Mesa","The war years"],["kitchen-martinis","Martinis in the Kitchen","The war years"],["pash-interview","The Interview with Pash","The war years"],["gadget-meeting","A Cold Night in the Cyclotron Building","The war years"],["interim-committee","The Interim Committee","The war years"],["trinity","The Storm Before the Shot","The war years"],["panel-final-report","The Panel's Last Word","The war years"],["farewell-ceremony","Good-bye to the Mesa","After the war"],["oval-office","The International Problem","After the war"],["eagle-hill-garden","The Garden at Eagle Hill","After the war"],["shelter-island","The Last Day on Shelter Island","After the war"],["huac-closed-session","The Closed Session","The hearing years"],["letter-to-uncle-jim","A Letter to Uncle Jim","The hearing years"],["face-to-face-with-crouch","Face to Face with Crouch","The hearing years"],["griggs-in-princeton","Griggs in Princeton","The hearing years"],["strauss-ultimatum","The Unsigned Letter","The hearing years"],["cross-examination","The Witness Chair, Day Three","The hearing years"],["dreadful-weapon","A Dreadful Weapon","The hearing years"],["fermi-award","The Fermi Award","The hearing years"]];
// sample progress per story through the 7 stages (0..4 levels; 'bad' = failing checks)
const STAGES=["Source","Notebook","Card inputs","Cards made","Checks","Read","Published"];
function storyStages(i){
  const base=["d4","d4","d1","d1",(i%5===3)?"bad":"d2","",""];
  if(i===7) return ["d4","d4","d3","d3","d2","d3",""];
  if(i===12) return ["d4","d4","d3","d1","d2","",""];
  return base;
}

const CARDS=[
 {part:"p1",title:"Riding out to the canyon",rows:[
  ["opening","I am riding northwest of Santa Fe with Major Dudley and Edwin McMillan. Dudley is the Army officer who has scouted dozens of sites for the laboratory. McMillan is a physicist from Berkeley and came along with me. The canyon is ahead, and I mean to see it clearly.","read",[],"Gemini",false],
  ["why","The Army has no home for the laboratory, and I am asked to run it. I came to see whether this canyon will serve.","checked",[],"Gemini",false],
  ["now","The car door is cold under my hand and dust coats my boots. I keep one hand on my hat against the wind.","checked",[],"Gemini",false],
  ["feeling","I am wary. The canyon mouth is just a shadow between two walls of rock, and I can't tell from here whether it opens up or closes in.","gen",[],"DeepSeek",false]]},
 {part:"p3",title:"Standing on the canyon floor",rows:[
  ["landing","We walked down into the canyon and stood on the bottom of it. The flat land turned out to be a thin snake of ground.","read",[],"Gemini",false],
  ["why","I want a say in where the work goes, and this snake of ground will not hold a town. Dudley has already written it into his report, and the Army likes a report that is finished before anyone has seen the place he is describing.","fail",["length: 47 words, limit 45 (CK-G07)"],"DeepSeek",false],
  ["now","McMillan paces the width of the floor and comes back shaking his head.","gen",[],"DeepSeek",false]]}
];

let toastT;
function toast(m){document.querySelector(".toast")?.remove();const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=m;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2400)}

function head(crumbs,title,lede,btns=""){
  return `<div class="crumb">${crumbs}</div><div class="head"><div><h1>${title}</h1>${lede?`<p class="lede">${lede}</p>`:""}</div><div class="btns">${btns}</div></div>`;
}

const V={};

V.board=()=>{
  const rows=STORIES.map((s,i)=>`<tr class="click" onclick="location.hash='cards'"><td class="num">${i+1}</td><td>${s[1]}<br>${key("opp."+s[0])}</td>${storyStages(i).map(d=>`<td class="cell"><span class="dot ${d}" title=""></span></td>`).join("")}</tr>`).join("");
  return head("Overview","Status board","Where every character and story stands, from source to what users see. Click a story to open its cards. All numbers on this page are sample data.")+
  `<div class="tiles">
   <div class="tile"><b>3</b><span>characters (1 live, 2 in writing)</span></div>
   <div class="tile"><b>27</b><span>stories with a notebook</span></div>
   <div class="tile"><b>41</b><span>items waiting for a person to read</span></div>
   <div class="tile"><b>0</b><span>stories published to users</span></div></div>
  <div class="grid3" style="margin-bottom:16px">
