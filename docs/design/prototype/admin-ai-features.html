<!doctype html>
<meta charset="utf-8">
<!-- AI feature screens (#432, part of #430), drawn in the look of the owner's admin prototype, admin-prototype.html in this folder.
     The CSS below is copied from that file unchanged (its token names --bg, --panel, --ink ... carry the same values as the
     app's --adm-* tokens in src/app/tokens.css), minus its phone-width block: desktop only, 1024 px and wider.
     Everything shown is sample data. Purpose text and pass questions are placeholders, never real wording. -->
<title>WaveParticle Content Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: a working tool. Left rail of pages, a dense main area; at phone width the rail becomes a scrolling strip. */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --ink:#1d2421; --muted:#5f6b66; --line:#dde2df; --soft:#eef1ef;
  --accent:#1f6f5c; --accent-soft:#e2f0eb; --ok:#2f7d4f; --ok-soft:#e3f2e8; --warn:#9a6a10; --warn-soft:#fbf0d9;
  --bad:#b23b3b; --bad-soft:#f8e3e3; --info:#3a5ea8; --info-soft:#e4ebf8; --phone:#16191c; --phone-ink:#ece7dc;
  --f-display:"Fraunces",Georgia,serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121615; --panel:#1a1f1e; --ink:#e4e9e6; --muted:#9aa6a1; --line:#2c3432; --soft:#212826;
  --accent:#5fc0a3; --accent-soft:#1d3530; --ok:#6cc58f; --ok-soft:#1c3226; --warn:#e0b55a; --warn-soft:#3a2f17;
  --bad:#ec8585; --bad-soft:#3d2121; --info:#8fb0f0; --info-soft:#1f2a40; --phone:#0b0d0e; --phone-ink:#ece7dc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --panel:#1a1f1e; --ink:#e4e9e6; --muted:#9aa6a1; --line:#2c3432; --soft:#212826;
  --accent:#5fc0a3; --accent-soft:#1d3530; --ok:#6cc58f; --ok-soft:#1c3226; --warn:#e0b55a; --warn-soft:#3a2f17;
  --bad:#ec8585; --bad-soft:#3d2121; --info:#8fb0f0; --info-soft:#1f2a40; --phone:#0b0d0e; --phone-ink:#ece7dc; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{font-family:var(--f-display);font-size:19px;font-weight:600;padding:0 8px 2px}
.brand small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.proto{margin:12px 8px 14px;font-size:11.5px;background:var(--warn-soft);color:var(--warn);padding:6px 8px;border-radius:6px}
.navgroup{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.rail a{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none}
.rail a:hover{background:var(--soft)}
.rail a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail a .k{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-weight:400}
main{padding-block:22px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb a{color:var(--muted)}
h1{font-family:var(--f-display);font-weight:600;font-size:26px;margin:4px 0 4px;text-wrap:balance}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
.lede{color:var(--muted);max-width:68ch;margin:0 0 18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:7px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
button.small{font-size:12px;padding:3px 9px}
button:focus-visible,a:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.key{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--soft);padding:1px 6px;border-radius:4px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-draft{background:var(--soft);color:var(--muted)}
.s-gen{background:var(--info-soft);color:var(--info)}
.s-fail{background:var(--bad-soft);color:var(--bad)}
.s-checked{background:var(--warn-soft);color:var(--warn)}
.s-read{background:var(--accent-soft);color:var(--accent)}
.s-pub{background:var(--ok-soft);color:var(--ok)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile b{display:block;font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
/* status board */
.board td.cell{padding:4px 3px;text-align:center}
.dot{display:inline-block;width:18px;height:18px;border-radius:4px;border:1px solid var(--line);background:var(--soft)}
.dot.d1{background:var(--info-soft);border-color:var(--info)}
.dot.d2{background:var(--warn-soft);border-color:var(--warn)}
.dot.d3{background:var(--accent-soft);border-color:var(--accent)}
.dot.d4{background:var(--ok);border-color:var(--ok)}
.dot.bad{background:var(--bad-soft);border-color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
/* pipeline */
.flow{display:grid;grid-template-columns:minmax(150px,1fr) 34px minmax(150px,1fr) 34px minmax(150px,1fr) 34px minmax(150px,1fr);align-items:stretch;min-width:820px}
.flow .col{display:flex;flex-direction:column;gap:6px}
.flow .colhead{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.node{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.node .key{margin-right:4px}
.arrow{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.lane{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);margin-bottom:14px}
.lane h2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lane p{color:var(--muted);margin:0 0 12px;max-width:80ch}
.states{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 0;font-size:12px}
/* cards editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.part{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:12px}
.part>header{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cardrow{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:start}
.cardrow:last-child{border-bottom:0}
.cardrow .kind{font-size:12px;color:var(--muted);padding-top:2px}
.cardrow .txt{border-radius:6px;padding:2px 4px;margin:-2px -4px}
.cardrow .txt[contenteditable="true"]{background:var(--soft);outline:1px dashed var(--accent)}
.cardrow .meta{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.fails{font-size:11.5px;color:var(--bad)}
.phone{background:var(--phone);color:var(--phone-ink);border-radius:26px;padding:18px 16px 22px;position:sticky;top:16px}
.phone .ph-top{font-size:11px;opacity:.6;display:flex;justify-content:space-between}
.phone .ph-goal{font-size:11px;opacity:.7;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.08em}
.phone .ph-goaltext{font-family:var(--f-display);font-size:15px;margin-bottom:14px}
.phone .slip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px;font-size:13.5px;line-height:1.55;min-height:120px}
.phone .slip small{display:block;opacity:.6;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.phone .ph-step{font-size:12px;opacity:.8;margin-top:12px}
.phone .ph-clock{font-family:var(--f-mono);font-size:28px;text-align:center;margin-top:10px}
/* prompts */
.assembly{display:flex;flex-direction:column;gap:6px}
.ppart{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--panel)}
.ppart.on{border-left-color:var(--accent);background:var(--accent-soft)}
.ppart .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.ppart .plus{color:var(--muted);text-align:center;font-size:12px}
pre.code{font-family:var(--f-mono);font-size:12px;background:var(--soft);border-radius:8px;padding:12px;white-space:pre-wrap;margin:0;line-height:1.55}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp .panel p{margin:0 0 8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 10px}
.tabs button.on{border-bottom-color:var(--accent);color:var(--accent);font-weight:600}
dl.fields{display:grid;grid-template-columns:170px minmax(0,1fr);gap:0;margin:0}
dl.fields dt,dl.fields dd{padding:9px 0;border-bottom:1px solid var(--line);margin:0}
dl.fields dt{color:var(--muted);font-size:12.5px;padding-right:12px}
dl.fields dd .key{margin-left:6px}
.note{font-size:12.5px;color:var(--muted)}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
select,input[type=text],textarea{font:inherit;font-size:13.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.check{display:flex!important;grid-template-columns:none;align-items:center;gap:8px;font-weight:400!important;color:var(--ink)!important}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.est{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13px}
dialog.sheet{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog.sheet::backdrop{background:rgba(0,0,0,.35)}
dialog.sheet .sh-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
dialog.sheet .sh-head h2{margin:0;font-size:16px}
dialog.sheet .sh-body{padding:16px;overflow:auto}
dialog.sheet .sh-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.lock{font-size:11.5px;color:var(--accent);font-weight:600}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.conn.off i{background:var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20}
.phase{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.phase:last-child{border-bottom:0}
.phase .pn{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500}
.phase h3{margin:0 0 4px;font-size:15px}
.phase p{margin:0 0 6px;color:var(--muted)}
.phase ul{margin:4px 0 0;padding-left:18px}
.idrow{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1.1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.idrow:last-child{border-bottom:0}
.idrow code{font-family:var(--f-mono);font-size:12px}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
/* Added for these screens only, from the same tokens. */
.app{min-width:1008px}
.sec{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.sec .sl{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500;padding-top:1px}
.panel>h2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.src{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.empty{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:10px 12px;margin:0}
ol.qs{margin:0;padding-left:20px}
ol.qs li{padding:4px 0}
.diff{font-family:var(--f-mono);font-size:12px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.diff div{padding:2px 10px;white-space:pre-wrap}
.diff .add{background:var(--ok-soft);color:var(--ok)}
.diff .del{background:var(--bad-soft);color:var(--bad)}
.qrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ro{opacity:.6}
/* #467: the AI feature registry, run panel, comparison lab, runs and samples. Same tokens. */
table.reg{min-width:1480px}
table.reg th:nth-child(1),table.reg td:nth-child(1){position:sticky;left:0;z-index:1;background:var(--panel);width:64px;min-width:64px}
table.reg th:nth-child(2),table.reg td:nth-child(2){position:sticky;left:64px;z-index:1;background:var(--panel);min-width:170px;box-shadow:inset -1px 0 0 var(--line)}
table.reg tr.click:hover td{background:var(--soft)}
table.reg td.wide{min-width:260px}
.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
.filters label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.filters select{width:auto}
.filters input[type=text]{width:240px}
.var{font-family:var(--f-mono);background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px}
.skel{background:var(--soft);border-radius:6px;height:12px;margin:10px 0}
.skel.w60{width:60%}.skel.w80{width:80%}
.errbox{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:40%;background:var(--accent)}
.side{display:flex;flex-direction:column;gap:10px}
.yn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.yn:last-child{border-bottom:0}
tr.sel td{background:var(--accent-soft)}
body[data-reg] button:disabled{opacity:.5;cursor:not-allowed}
</style>

<div class="app">
  <nav class="rail" id="rail" aria-label="Admin pages"></nav>
  <main id="main"></main>
</div>

<script>
/* Sample data only. Purpose text and pass questions are placeholders, never real wording. */
let toastT, asWriter=false;
function toast(m){document.querySelector(".toast")?.remove();const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=m;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2400)}
function head(crumbs,title,lede,btns=""){
  return `<div class="crumb">${crumbs}</div><div class="head"><div><h1>${title}</h1>${lede?`<p class="lede">${lede}</p>`:""}</div><div class="btns">${btns}</div></div>`;
}
const P="admin-prototype.html";
const PAGES=[
 {g:"Overview"},{t:"Status board",k:"ADM-01",h:P+"#board"},{t:"Pipeline",k:"ADM-02",h:P+"#pipeline"},
 {g:"Content"},{t:"Characters",k:"ADM-03",h:P+"#characters"},{t:"Character profile",k:"ADM-04",h:P+"#character"},{t:"Life path",k:"ADM-05",h:P+"#lifepath"},{t:"Story cards",k:"ADM-06",h:P+"#cards"},{t:"App text",k:"ADM-07",h:P+"#uitext"},
 {g:"AI rules"},{t:"AI features",k:"ADM-16",h:"#index",ai:true},{t:"Prompts",k:"ADM-08",h:P+"#prompts"},{t:"Checks",k:"ADM-09",h:P+"#checks"},{t:"Models",k:"ADM-13",h:P+"#models"},
 {g:"Review and logs"},{t:"Review queue",k:"ADM-10",h:P+"#review"},{t:"Live log",k:"ADM-11",h:P+"#live"},{t:"Publish history",k:"ADM-12",h:P+"#history"},
 {g:"Screens in this drawing"},
 {t:"AI features index",k:"AIF-1",h:"#index"},{t:"Feature page",k:"AIF-2",h:"#feature"},{t:"Published and draft",k:"AIF-3",h:"#prompt"},{t:"Test results",k:"AIF-4",h:"#tests"},
 {t:"Status editor",k:"AIF-5",h:"#status"},{t:"Pass standard editor",k:"AIF-6",h:"#pass"},{t:"Purpose and approach",k:"AIF-7",h:"#purpose"},{t:"Feature and prompts",k:"AIF-8",h:"#mapping"}
];
const ST={ns:["Not started","s-draft"],ex:["Exploring","s-gen"],ps:["Passed","s-pub"],fz:["Frozen","s-read"]};
const pill=s=>`<span class="pill ${ST[s][1]}">${ST[s][0]}</span>`;
const F=[
 {n:"Goal split",k:["plan_split"],s:"ex",v:"v3",d:true,run:"Sample date · stub"},
 {n:"Step cards",k:["step_cards"],s:"ex",v:"v5",d:false,run:"Sample date · stub"},
 {n:"Pause message",k:["stuck_story","pause_predicament"],s:"ex",v:"v2 · v1",d:true,run:"Sample date · stub"},
 {n:"Rest reply",k:["rest_reply"],s:"ex",v:"v1",d:false,run:null},
 {n:"Return pop-up",k:["return_popup"],s:"ex",v:"v1",d:false,run:"Sample date · stub"},
 {n:"Closing line",k:["closing_line"],s:"ex",v:"v1",d:false,run:null},
 {n:"Safety classifier",k:["safety_classifier"],s:"ex",v:"v1",d:false,run:"Sample date · stub"}
];
const keys=f=>f.k.map(k=>`<span class="key">${k}</span>`).join(" ");
const title=f=>`${f.n} (${f.k.join(" + ")})`;
const FAKE=`<span class="pill s-checked">Fake model (stub)</span>`;
const DRAFT=`<span class="pill s-checked">Draft - owner to edit</span>`;
const CR=`AI rules › <a href="#index">AI features</a>`;
const PAUSE=title(F[2]);
const V={};

 `<div class="panel scroll"><table><thead><tr><th>Feature</th><th>Purpose</th><th>Status</th><th>Active prompt</th><th>Last offline run</th></tr></thead><tbody>`+

 {n:'Oppenheimer story 1 ("The Trade of a Theorist")',c:"Oppenheimer"},
 {n:"Snape chapter 7",c:"Snape"},
 {n:"One dialogue scene",c:""}
];
const RUNS=[
 {who:"Admin (sample)",f:"R-03",v:"Draft",s:0,m:"Stub model"},
 {who:"Writer (sample)",f:"P-05",v:"Published",s:1,m:"Stub model"},
 {who:"Admin (sample)",f:"R-01",v:"Pasted text",s:2,m:"Stub model"},
 {who:"Admin (sample)",f:"G-05",v:"Published",s:0,m:"Stub model"}
];
let regF={cat:"",st:"",q:"",desc:false},blind=true,runSel=0,sampleSel=0;
const findRow=id=>REG.find(r=>r.id===id)||REG.find(r=>r.id==="R-03");
const roleOf=st=>st==="writer"?"writer":"admin";
const roleTag=st=>(st==="writer"?`<span class="pill s-draft">Viewing as writer</span>`:`<span class="pill s-read">Viewing as admin</span>`)+
 (st==="admin"||st==="writer"?"":` <span class="pill s-draft">State: ${STATES.find(x=>x[0]===st)[1]}</span>`);
const CRR=st=>`AI rules › <a href="#reg-registry/${roleOf(st)}">AI features</a>`;
const LOADING=what=>`<div class="panel" role="status" aria-busy="true"><h2>Loading ${what}…</h2><div class="skel w80"></div><div class="skel"></div><div class="skel w60"></div></div>`;
const MODEL_ERR=`<p class="errbox" role="alert"><span><b>The model did not answer.</b> Sample reason: no answer within the time limit. Nothing was saved and nothing was charged.</span><button class="small" onclick="toast('Retry (prototype)')">Retry</button></p>`;
const LOAD_ERR=what=>`<p class="errbox" role="alert"><span><b>${what} could not be read.</b> This page calls no model.</span><button class="small" onclick="toast('Retry (prototype)')">Retry</button></p>`;
const RUNNING=(what,stub=true)=>`<div role="status"><p style="margin:0"><span class="pill s-gen">Run in progress</span> ${what} · started by you${stub?" · "+FAKE:""}</p><div class="bar"><i></i></div><button class="small" onclick="toast('Cancelled (prototype)')">Cancel</button></div>`;
const PUB=["Sample text: a stand-in for the published prompt, not its wording.","You write for {{persona}}.","Use only {{source_excerpt}} and {{facts}}.","Answer in the output format of this row."];
const DRF=["Sample text: a stand-in for the published prompt, not its wording.","You write for {{persona}}.","Use only {{source_excerpt}}, {{facts}} and {{world_record}}.","Answer in the output format of this row."];
const ANSWER="Sample text: the stub model's fixed answer, not real output.";
const PASSQ=[1,2,3].map(n=>`Pass question ${n} from the database`);
const ynRow=(q,i,side)=>`<div class="yn"><span>${q}</span><div class="seg" role="group" aria-label="${side}, question ${i+1}"><button class="small" aria-pressed="false">Yes</button><button class="small" aria-pressed="false">No</button></div></div>`;

V["reg-registry"]=st=>{
 const writer=st==="writer";
 const h=head("AI rules","AI features",`One table of every AI feature, from book to dialogue (<span class="key">/admin/ai-features</span>). Rows from the owner's seed of 2026-11-26.`,roleTag(st));
 if(st==="loading")return h+LOADING("the registry");
 const cats=["Pipeline","Quality gate","Runtime"];
 const filters=`<div class="filters"><label>Category<select onchange="regF.cat=this.value;render()"><option value="">All</option>${cats.map(c=>`<option ${regF.cat===c?"selected":""}>${c}</option>`).join("")}</select></label>
  <label>Status<select onchange="regF.st=this.value;render()"><option value="">All</option>${Object.keys(RST).map(s=>`<option value="${s}" ${regF.st===s?"selected":""}>${ST[RST[s]][0]}</option>`).join("")}</select></label>
  <label>Search<input type="text" value="${esc(regF.q)}" placeholder="ID, name or any text" onchange="regF.q=this.value;render()"></label>
  <button onclick="regF.desc=!regF.desc;render()">Sort by ID ${regF.desc?"↓":"↑"}</button></div>`;
 const q=regF.q.toLowerCase();
 let rows=st==="empty"||st==="error"?[]:REG.filter(r=>(!regF.cat||r.category===regF.cat)&&(!regF.st||r.status===regF.st)&&(!q||Object.values(r).join(" ").toLowerCase().includes(q)));
 if(regF.desc)rows=[...rows].reverse();
 const head8=`<tr><th>ID</th><th>Name</th><th>Category</th><th>Where it appears</th><th>Requirement</th><th>Prompt</th><th>Status</th><th>Example</th></tr>`;
 const body=rows.length?rows.map(r=>`<tr class="click" onclick="location.hash='reg-feature/${roleOf(st)}/${r.id}'"><td><span class="key">${r.id}</span></td><td><b>${esc(r.name)}</b>${st==="running"&&r.id==="R-03"?`<br><span class="pill s-gen">Run in progress</span>`:""}</td><td>${r.category}</td><td class="note">${val(r.where)}</td><td class="wide">${val(r.requirement)}</td><td><span class="key">${esc(r.prompt)}</span> <a href="#reg-feature/${roleOf(st)}/${r.id}" onclick="event.stopPropagation()">view</a></td><td>${pill(RST[r.status])}${writer?"":` <button class="small" onclick="event.stopPropagation();location.hash='reg-feature/admin/${r.id}'">Change</button>`}</td><td>${expill(r.example_state)}</td></tr>`).join("")
  :`<tr><td colspan="8"><p class="empty">${st==="empty"?"No features yet":st==="error"?"Nothing to show":"No feature matches these filters"}</p></td></tr>`;
 return h+(st==="error"?LOAD_ERR("The registry")+`<div style="height:12px"></div>`:"")+filters+
  `<div class="panel scroll"><table class="reg"><thead>${head8}</thead><tbody>${body}</tbody></table></div>
  <div class="legend"><span>Example: ${expill("none")} ${expill("candidate")} ${expill("confirmed")}</span><span>Status: ${pill("ns")} ${pill("ex")} ${pill("ps")} ${pill("fz")}</span><span>${writer?"Status is admin only: a writer sees no Change button.":"Change opens the status control on the feature page (admin only)."}</span></div>
  <p class="note" style="margin-top:10px">The table scrolls sideways inside its panel; ID and Name stay visible. ID order follows the seed: P (Pipeline), G (Quality gate), R (Runtime).</p>`;
};

V["reg-feature"]=(st,id)=>{
 const r0=findRow(id),writer=st==="writer",empty=st==="empty";
 const r=empty?{...r0,where:"",requirement:"",prompt:"",output_format:"",rationale:"",room_to_improve:"",example_state:"none",example_or_notes:"",status:"not started"}:r0;
 const h=head(CRR(st)+` › ${r.id}`,`${r.id} ${esc(r.name)}`,`${r.category} · Where it appears: ${val(r.where)}`,
  roleTag(st)+`<a class="btn" href="#reg-run/${roleOf(st)}/${r.id}">Run</a>`);
 if(st==="loading")return h+LOADING("this feature");
 const latest=st==="error"?MODEL_ERR:st==="running"?RUNNING("Run of the draft on Oppenheimer story 1"):empty?`<p class="empty">No runs yet</p>`:
  `<p class="note" style="margin:0">Sample date · Admin (sample) · Draft · Oppenheimer story 1 · ${FAKE} · result set as ${expill("candidate")}</p>`;
 const prompt=empty?`<p class="empty">Not written yet</p>`:
  `<p style="margin:0 0 8px"><span class="key">${esc(r.prompt)}</span> <span class="pill s-pub">Published</span> <span class="pill s-draft">Draft</span> ${SAMPLE}</p>
  <div class="cmp"><div><p class="note" style="margin:0 0 6px">Published</p><pre class="code">${PUB.map(hv).join("\n")}</pre></div>
  <div><p class="note" style="margin:0 0 6px">Draft</p><pre class="code">${DRF.map(hv).join("\n")}</pre></div></div>
  <p class="note" style="margin:12px 0 6px">Changed lines</p><div class="diff"><div>  ${hv(PUB[1])}</div><div class="del">- ${hv(PUB[2])}</div><div class="add">+ ${hv(DRF[2])}</div><div>  ${hv(PUB[3])}</div></div>
  <p class="src">The real text is read live from <span class="key">public.prompts</span>, never copied. <span class="var">{{variables}}</span> are filled from a sample.</p>`;
 const exHist=r.example_state==="none"?`<p class="empty" style="margin-top:10px">No earlier examples</p>`:
  `<table style="margin-top:10px"><thead><tr><th>When</th><th>Who</th><th>Change</th></tr></thead><tbody><tr><td class="note">Sample date</td><td>Setup</td><td>Seeded as ${expill(r.example_state)}</td></tr></tbody></table>`;
 const example=r.example_state==="none"?`<p class="empty">Not written yet</p>`:
  `<p style="margin:0 0 6px">${expill(r.example_state)} ${r.example_state==="confirmed"?`<span class="note">Confirmed by Setup (sample) · sample date</span>`:`<span class="note">From a run · sample date</span> <button class="small" onclick="toast('Confirmed (prototype)')">Confirm</button>`}</p><p style="margin:0">${exText(r)}</p>${exHist}`;
 const status=writer?`<div class="panel ro"><h2>Status ${pill(RST[r.status])} <span class="lock">Admin only</span></h2><p class="note" style="margin:0">You can see the status. Only an admin can change it.</p></div>`:
  `<div class="panel"><h2>Status ${pill(RST[r.status])}</h2><div class="form"><div class="seg" role="group" aria-label="Status">${Object.keys(RST).map(s=>`<button aria-pressed="${s===r.status}">${ST[RST[s]][0]}</button>`).join("")}</div>
  <label>Reason (one line)<input type="text" placeholder="Why the status changes"></label><div><button class="primary" onclick="toast('Status saved (prototype)')">Save status</button></div></div></div>`;
 const runtime=r.category==="Runtime"?`<div class="panel"><h2>Fix added after a rejected answer <span class="key">retry_hints</span></h2><pre class="code">${hv("Sample text: a stand-in for retry_hints. It is sent with {{reason}} when an answer fails a check.")}</pre><p class="src">Read live from <span class="key">public.prompts</span>; the same text shows on every Runtime row.</p></div>`:"";
 const hist=empty?`<p class="empty">No changes yet</p>`:`<table><thead><tr><th>When</th><th>Who</th><th>Field</th></tr></thead><tbody><tr><td class="note">Sample date</td><td>Setup</td><td>Every field, from the seed of 2026-11-26</td></tr></tbody></table>`;
 const sec=(t,b)=>`<div class="panel"><h2>${t}</h2>${b}</div>`;
 const p=s=>`<p style="margin:0">${val(s)}</p>`;
 return h+`<div class="stack">`+sec("Latest run",latest)+sec("Requirement",p(r.requirement))+sec("Prompt",prompt)+sec("Output format and rules",p(r.output_format))+
  sec("Design rationale",p(r.rationale))+sec("Room to improve",p(r.room_to_improve))+sec("Confirmed example",example)+sec("Notes",`<p class="empty">Not written yet</p>`)+
  sec("Pass standard",`<p class="empty">Not written yet</p>`)+status+sec("Version history",hist)+runtime+`</div>`;
};

V["reg-run"]=(st,id)=>{
 const r=findRow(id);
 const h=head(CRR(st)+` › <a href="#reg-feature/${roleOf(st)}/${r.id}">${r.id}</a> › Run`,`Run ${r.id} ${esc(r.name)}`,"A panel on the feature page. Admin and writer can both run. The model key stays on the server; there is no spending cap and every run is recorded.",roleTag(st));
 if(st==="loading")return h+`<div class="grid2">${LOADING("prompt versions and samples")}${LOADING("the answer")}</div>`;
 const busy=st==="running";
 const form=`<div class="panel"><h2>Run settings</h2><div class="form">
  <label>Prompt version<div class="seg" role="group" aria-label="Prompt version"><button aria-pressed="false">Published</button><button aria-pressed="true">Draft</button><button aria-pressed="false">Pasted text</button></div></label>
  <label>Pasted text (only with Pasted text)<textarea placeholder="Paste a prompt to try. It is not saved as a version." disabled></textarea></label>
  <label>Sample<select>${SAMPLES.map(s=>`<option>${esc(s.n)}</option>`).join("")}</select></label>
  <label>Model<select><option>Stub model (fake, no charge)</option><option>DeepSeek (sample name)</option></select></label>
  <div><button class="primary" ${busy?"disabled":""} onclick="toast('Run (prototype)')">${busy?"Running…":"Run"}</button></div>
  <p class="note" style="margin:0">Today's spend: $0.00 (sample). Not a cap.</p></div></div>`;
 const result=st==="empty"?`<p class="empty">No runs yet</p>`:st==="error"?MODEL_ERR:busy?RUNNING("Draft on Oppenheimer story 1"):
  `<p style="margin:0 0 8px">${FAKE} <span class="note">The answer is fixed test text, not written by a model.</span></p><pre class="code">${ANSWER}</pre>
  <table style="margin-top:12px"><thead><tr><th>Check that applies</th><th>Result</th></tr></thead><tbody>
   <tr><td>Output format of this row</td><td><span class="pill s-pub">Pass</span></td></tr>
   <tr><td>Sample check 2</td><td><span class="pill s-pub">Pass</span></td></tr>
   <tr><td>Sample check 3</td><td><span class="pill s-fail">Fail</span></td></tr></tbody></table>
  <dl class="fields" style="margin-top:12px"><dt>Tokens</dt><dd>Sample: 0 in · 0 out</dd><dt>Cost</dt><dd>$0.00 (stub, no charge)</dd><dt>Prompt version</dt><dd>Draft</dd><dt>Sample</dt><dd>${esc(SAMPLES[0].n)}</dd></dl>
  <div class="btns" style="margin-top:12px"><button onclick="toast('Set as candidate (prototype)')">Set as candidate example</button><button onclick="toast('Confirmed (prototype)')">Confirm</button></div>
  <p class="src">Confirm records who and when; a replaced confirmed example stays in history.</p>`;
 return h+`<div class="grid2">${form}<div class="panel"><h2>Answer</h2>${result}</div></div>
  <p class="note" style="margin-top:10px">${st==="writer"?"A writer has the same panel: run, set a candidate and confirm. Only the status is admin only.":"An admin and a writer see the same panel."}</p>`;
};

V["reg-lab"]=st=>{
 const h=head("AI rules","Comparison lab",`The same sample through two prompt versions or two models, side by side (<span class="key">/admin/ai-lab</span>). No user text is ever sent through the lab.`,roleTag(st));
 if(st==="loading")return h+LOADING("features, samples and versions");
 const busy=st==="running";
 const form=`<div class="panel" style="margin-bottom:14px"><div class="grid2"><div class="form">
  <label>Feature<select>${REG.map(r=>`<option ${r.id==="R-03"?"selected":""}>${r.id} ${esc(r.name)}</option>`).join("")}</select></label>
  <label>Sample (the same for both sides)<select>${SAMPLES.map(s=>`<option>${esc(s.n)}</option>`).join("")}</select></label></div>
  <div class="form"><label>Side A<select><option>Published version</option><option>Draft version</option><option>Stub model</option><option>DeepSeek (sample name)</option></select></label>
  <label>Side B<select><option>Draft version</option><option>Published version</option><option>Stub model</option><option>DeepSeek (sample name)</option></select></label></div></div>
  <div class="btns" style="margin-top:12px;align-items:center"><label class="check"><input type="checkbox" ${blind?"checked":""} onchange="blind=this.checked;render()"> Blind: hide which side is which until the pass questions are answered</label>
  <button class="primary" ${busy?"disabled":""} onclick="toast('Run both (prototype)')">${busy?"Running…":"Run both"}</button></div></div>`;
 if(st==="empty")return h+form+`<p class="empty">No runs yet</p>`;
 const side=(n,label)=>{
  const name=blind?`Side ${n}`:label;
  const body=busy?RUNNING(blind?`Side ${n}`:label):st==="error"&&n===2?MODEL_ERR:
   `<p style="margin:0">${FAKE}</p><pre class="code">${ANSWER}</pre>
   <div><p class="note" style="margin:0 0 4px">Pass questions (yes or no). The pass standard of this row is not written yet; these are placeholders.</p>${PASSQ.map((q,i)=>ynRow(q,i,name)).join("")}</div>`;
  return `<div class="panel side"><h2>${name} ${blind?`<span class="pill s-draft">Hidden until answered</span>`:""}</h2>${body}</div>`;
 };
 return h+form+`<div class="cmp">${side(1,"Side A · Published version")}${side(2,"Side B · Draft version")}</div>
  <div class="btns" style="margin-top:14px"><button class="primary" ${busy||st==="error"?"disabled":""} onclick="toast('Result saved (prototype)')">Save result</button></div>
  <p class="note" style="margin-top:10px">${st==="error"?"Save result waits until both sides have an answer. ":""}The answers are saved with the run.${st==="writer"?" A writer uses the lab like an admin.":""}</p>`;
};

V["reg-runs"]=st=>{
 const h=head("AI rules","Runs",`Every run: who, when, feature, prompt version, sample, model, tokens, cost and whether the model was a stub (<span class="key">/admin/ai-runs</span>). There is no spending cap.`,roleTag(st));
 if(st==="loading")return h+LOADING("the run log");
 const none=st==="empty";
 const rows=none?[]:RUNS.map((x,i)=>({...x,state:i===0&&st==="running"?"running":i===0&&st==="error"?"error":"done"}));
 const tiles=`<div class="tiles"><div class="tile"><b>$0.00</b><span>Today's spend (sample)</span></div><div class="tile"><b>${rows.length}</b><span>Runs today (sample)</span></div><div class="tile"><b>${rows.length}</b><span>Stub runs</span></div><div class="tile"><b>0</b><span>Real model runs</span></div></div>`;
 const byUser=none?`<p class="empty">No runs yet</p>`:`<table><thead><tr><th>User</th><th class="num">Runs</th><th class="num">Spend today</th></tr></thead><tbody><tr><td>Admin (sample)</td><td class="num">3</td><td class="num">$0.00</td></tr><tr><td>Writer (sample)</td><td class="num">1</td><td class="num">$0.00</td></tr></tbody></table>`;
 const filter=`<div class="filters"><label>Feature<select><option>All</option>${REG.map(r=>`<option>${r.id} ${esc(r.name)}</option>`).join("")}</select></label><label>User<select><option>All</option><option>Admin (sample)</option><option>Writer (sample)</option></select></label><label>Model<select><option>All</option><option>Stub model</option><option>DeepSeek (sample name)</option></select></label><label class="check"><input type="checkbox"> Stub runs only</label></div>`;
 const sel=Math.min(runSel,Math.max(rows.length-1,0));
 const res=x=>x.state==="running"?`<span class="pill s-gen">Run in progress</span>`:x.state==="error"?`<span class="pill s-fail">Model error</span>`:`<span class="pill s-pub">Answered</span>`;
 const table=none?`<p class="empty">No runs yet</p>`:`<table><thead><tr><th>When</th><th>Who</th><th>Feature</th><th>Version</th><th>Sample</th><th>Model</th><th class="num">Tokens</th><th class="num">Cost</th><th>Stub</th><th>Result</th></tr></thead><tbody>`+
  rows.map((x,i)=>`<tr class="click${i===sel?" sel":""}" onclick="runSel=${i};render()"><td class="note">Sample date</td><td>${x.who}</td><td><span class="key">${x.f}</span> ${esc(findRow(x.f).name)}</td><td>${x.v}</td><td class="note">${esc(SAMPLES[x.s].n)}</td><td>${x.m}</td><td class="num">0</td><td class="num">$0.00</td><td><span class="pill s-checked">Stub</span></td><td>${res(x)}</td></tr>`).join("")+`</tbody></table>`;
 const x=rows[sel];
 const detail=!x?"":`<div class="panel" style="margin-top:14px"><h2>Run detail <span class="key">${x.f}</span> ${FAKE}</h2>
  <dl class="fields" style="margin-bottom:12px"><dt>Who and when</dt><dd>${x.who} · sample date</dd><dt>Prompt version</dt><dd>${x.v}</dd><dt>Sample</dt><dd>${esc(SAMPLES[x.s].n)}</dd><dt>Model</dt><dd>${x.m} · tokens 0 · $0.00</dd></dl>
  <div class="grid2"><div><p class="note" style="margin:0 0 6px">Input</p><pre class="code">${hv("Sample text: the prompt as sent, with {{persona}} and {{source_excerpt}} filled from the sample.")}</pre></div>
  <div><p class="note" style="margin:0 0 6px">Output</p>${x.state==="error"?MODEL_ERR:x.state==="running"?RUNNING("This run"):`<pre class="code">${ANSWER}</pre>`}</div></div></div>`;
 return h+tiles+`<div class="grid2" style="margin-bottom:14px"><div class="panel"><h2>Total by user, today</h2>${byUser}</div><div class="panel"><h2>Filter</h2>${filter}</div></div>
  <div class="panel scroll">${table}</div>${detail}
  <p class="note" style="margin-top:10px">${st==="writer"?"A writer sees the same log (owner to confirm).":"Today's spend is a read-only line, not a cap."}</p>`;
};

V["reg-samples"]=st=>{
 const busy=st==="running";
 const h=head("AI rules","Samples",`The sample library that fills a prompt's <span class="var">{{variables}}</span> (<span class="key">/admin/ai-samples</span>). <span class="lock">Admin and writer only</span>: never read by the app or users.`,
  roleTag(st)+`<button class="primary" ${busy?"disabled":""} onclick="toast('Add (prototype)')">Add a finished story as a sample</button>`);
 if(st==="loading")return h+LOADING("the sample library");
 const none=st==="empty"||st==="error";
 const top=st==="error"?LOAD_ERR("The sample library")+`<div style="height:12px"></div>`:busy?`<div class="panel" style="margin-bottom:14px">${RUNNING("Adding a finished story as a sample",false)}</div>`:"";
 const list=none?`<p class="empty">No samples yet</p>`:`<table><thead><tr><th>Name</th><th>Companion</th><th>Source named</th><th>Words</th></tr></thead><tbody>`+
  SAMPLES.map((s,i)=>`<tr class="click${i===sampleSel?" sel":""}" onclick="sampleSel=${i};render()"><td><b>${esc(s.n)}</b></td><td>${val(s.c)}</td><td>${NWY}</td><td class="note">Not counted yet</td></tr>`).join("")+`</tbody></table>`;
 const s=SAMPLES[sampleSel];
 const f=(t,v)=>`<dt>${t}</dt><dd>${SAMPLE} ${v}</dd>`;
 const detail=none?"":`<div class="panel" style="margin-top:14px"><h2>${esc(s.n)}</h2><dl class="fields">
  ${f("Persona","Placeholder for the Companion's persona.")}
  <dt>Source excerpt</dt><dd>${SAMPLE} Placeholder for the excerpt this story uses. Only the excerpt is stored, never a whole book.<p class="src">Source: ${NWY}</p></dd>
  ${f("Facts","Placeholder for the facts.")}${f("World record","Placeholder for the world record.")}${f("Standing task","Placeholder for the standing task.")}${f("Finished plan","Placeholder, used when a later step needs it.")}</dl></div>`;
 return h+top+`<div class="panel">${list}</div>${detail}
  <p class="note" style="margin-top:10px">${st==="writer"?"A writer reads the library and may add a finished story (owner to confirm).":"Seeded with three samples (AI-LAB-SAMPLES)."}</p>`;
};

function render(){
  // A hash is a screen, or for the #467 screens "screen/state" or "screen/state/row id".
  const [id,s,rid]=(location.hash||"#index").slice(1).split("/");const cur=V[id]?id:"index";
  const reg=cur.startsWith("reg-"),st=reg&&STATES.some(x=>x[0]===s)?s:"admin";
  const link=(h,t,k,on)=>`<a href="${h}" class="${on?"on":""}">${t}<span class="k">${k}</span></a>`;
  document.getElementById("rail").innerHTML=`<div class="brand">WaveParticle<small>Content admin</small></div><div class="proto">Prototype · sample data · nothing is saved</div>`+
   PAGES.map(p=>p.g?`<div class="navgroup">${p.g}</div>`:link(p.h,p.t,p.k,p.ai||p.h==="#"+cur)).join("")+
   `<div class="navgroup">Registry screens (#467)</div>`+RSCREENS.map(([h,t,k])=>link(`#${h}/${st}${rid?"/"+rid:""}`,t,k,h===cur)).join("")+
   (reg?`<div class="navgroup">State (#467)</div>`+STATES.map(([k,t])=>link(`#${cur}/${k}${rid?"/"+rid:""}`,t,"",k===st)).join(""):"");
  if(reg)document.body.dataset.reg="";else delete document.body.dataset.reg;
  document.getElementById("main").innerHTML=reg?V[cur](st,rid):V[cur]();
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
render();
</script>
